[package]
name = "native-brick-breaker"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Scripting-first native 2D runtime using winit, wgpu, Flecs, Jolt Physics, gilrs, miniaudio and QuickJS-NG"

[dependencies]
anyhow = "=1.0.100"
oxijolt = "=1.5.0"
bytemuck = { version = "=1.25.0", features = ["derive"] }
crossbeam-queue = "=0.3.12"
flecs_ecs = "=0.2.2"
gilrs = "=0.11.2"
maudio = { version = "=0.1.15", default-features = false, features = ["engine"] }
pollster = "=0.4.0"
rquickjs = { version = "=0.14.0", features = ["std"] }
wgpu = "=30.0.1"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"] }

[dev-dependencies]
criterion = "=0.8.2"

[[bench]]
name = "runtime"
harness = false
