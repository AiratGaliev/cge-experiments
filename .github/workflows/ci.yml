name: CI Fast

on:
  pull_request:
    branches: [dev, test, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: fast-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust-brick-breaker

    steps:
      - name: Checkout event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate pull request routing
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BASE_BRANCH" in
            dev)
              case "$HEAD_BRANCH" in
                feat/*|feature/*|fix/*|refactor/*|test/*|docs/*|chore/*|hotfix/*)
                  echo "Допустимый маршрут: $HEAD_BRANCH -> dev"
                  ;;
                *)
                  echo "::error::Рабочие PR должны использовать feat/*, feature/*, fix/*, refactor/*, test/*, docs/*, chore/* или hotfix/* и направляться в dev."
                  exit 1
                  ;;
              esac
              ;;
            test)
              if [[ "$HEAD_BRANCH" != "dev" ]]; then
                echo "::error::В test допускается только PR из dev."
                exit 1
              fi
              echo "Допустимый маршрут: dev -> test"
              ;;
            main)
              case "$HEAD_BRANCH" in
                test|hotfix/*)
                  echo "Допустимый маршрут: $HEAD_BRANCH -> main"
                  ;;
                *)
                  echo "::error::В main допускается только PR из test или аварийной ветки hotfix/*."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::Неизвестная целевая ветка: $BASE_BRANCH"
              exit 1
              ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust-brick-breaker/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install Linux native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config libvulkan-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev \
            libdbus-1-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxss-dev libxrender-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      - name: Install locked TypeScript dependency
        run: npm ci

      - name: Typecheck TypeScript game
        run: npm run typecheck

      - name: Build TypeScript game
        run: npm run build

      - name: Test TypeScript game rules
        run: npm test

      - name: Verify generated JavaScript is up to date
        run: git diff --exit-code -- assets/game.js

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-brick-breaker -> target

      - name: Verify replaced native backends are absent
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree --locked --all-targets --prefix none | grep -E '^(sdl3|sdl3-sys|flecs_ecs|boxdd|boxdd-sys|box2d|box2d-sys) v'; then
            echo "::error::A replaced native runtime dependency is still present."
            exit 1
          fi

      - name: Verify full Bevy Engine subsystems are not linked
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree --locked --all-targets --prefix none | grep -E '^(bevy_render|bevy_winit|bevy_audio|bevy_sprite|bevy_core_pipeline|bevy_pbr|bevy_gltf|bevy_ui) v'; then
            echo "::error::A full Bevy Engine rendering, window integration, audio or presentation subsystem is still present."
            exit 1
          fi

      - name: Verify Bevy ECS and Avian parallel features are enabled
        shell: bash
        run: |
          set -euo pipefail
          # Let Cargo calculate the exact lockfile delta for the newly enabled feature graph.
          ecs_features="$(cargo tree --all-targets --edges features --invert bevy_ecs)"
          echo "::group::Cargo.lock delta from feature resolution"
          git diff -- Cargo.lock
          echo "::endgroup::"
          if ! grep -Fq 'bevy_ecs feature "multi_threaded"' <<<"$ecs_features"; then
            echo "::error::bevy_ecs/multi_threaded must remain enabled for the multithreaded schedule executor."
            exit 1
          fi

          avian_features="$(cargo tree --locked --all-targets --edges features --invert avian2d)"
          if ! grep -Fq 'avian2d feature "parallel"' <<<"$avian_features"; then
            echo "::error::avian2d/parallel must remain enabled for parallel physics acceleration."
            exit 1
          fi

          parry_features="$(cargo tree --locked --all-targets --edges features --invert parry2d)"
          if ! grep -Fq 'parry2d feature "parallel"' <<<"$parry_features"; then
            echo "::error::parry2d/parallel must remain enabled through Avian."
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust unit and integration tests
        run: cargo test --all-targets --locked

      - name: Check all Rust targets
        run: cargo check --all-targets --locked
