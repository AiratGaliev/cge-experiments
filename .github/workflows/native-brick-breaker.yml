name: Native Brick Breaker CI

on:
  push:
    branches:
      - "feat/cod-115-*"
    paths:
      - "rust-brick-breaker/**"
      - ".github/workflows/native-brick-breaker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "rust-brick-breaker/**"
      - ".github/workflows/native-brick-breaker.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-brick-breaker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Resolve, format and commit task lock
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust-brick-breaker
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Generate reproducible dependency lock
        run: cargo generate-lockfile

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit lockfile and formatting when changed
        env:
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          git add Cargo.lock src build.rs
          if git diff --cached --quiet; then
            echo "Cargo.lock and Rust formatting are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(COD-115): pin dependencies and format Rust sources [skip ci]"
          git push origin "HEAD:${TARGET_REF}"

  verify:
    name: verify (${{ matrix.os }})
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust-brick-breaker
    steps:
      - name: Checkout latest task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust-brick-breaker/package-lock.json

      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config libclang-dev libvulkan-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev \
            libdbus-1-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxss-dev libxrender-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

      - name: Install TypeScript dependency
        run: npm ci

      - name: Typecheck and compile TypeScript
        run: |
          npm run typecheck
          npm run build

      - name: Test TypeScript game rules
        run: npm test

      - name: Verify generated JavaScript is up to date
        run: git diff --exit-code -- assets/game.js

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-brick-breaker -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --all-targets

      - name: Check native application target
        run: cargo check --all-targets
