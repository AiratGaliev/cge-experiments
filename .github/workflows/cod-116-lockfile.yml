name: Refresh COD-116 Cargo lockfile

on:
  push:
    branches:
      - feat/cod-116-native-runtime-stack

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Install project Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Resolve the pinned native dependency graph
        working-directory: rust-brick-breaker
        run: cargo generate-lockfile
      - name: Commit updated Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- rust-brick-breaker/Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-brick-breaker/Cargo.lock
          git commit -m "chore(cod-116): refresh native dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
