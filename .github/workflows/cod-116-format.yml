name: Format COD-116 Rust sources

on:
  push:
    branches:
      - feat/cod-116-native-runtime-stack

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply formatting to all Rust targets
        working-directory: rust-brick-breaker
        run: cargo fmt --all
      - name: Commit formatting output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- rust-brick-breaker/src rust-brick-breaker/benches; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-brick-breaker/src rust-brick-breaker/benches
          git commit -m "style(cod-116): format final lifecycle changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
