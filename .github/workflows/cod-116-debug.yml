name: Diagnose COD-116 Avian schedule

on:
  push:
    branches:
      - feat/cod-116-native-runtime-stack

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust-brick-breaker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install Linux native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends             build-essential clang cmake ninja-build pkg-config libvulkan-dev             libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev             libdbus-1-dev libwayland-dev libxkbcommon-dev             libx11-dev libxext-dev libxfixes-dev libxi-dev libxcursor-dev             libxrandr-dev libxss-dev libxrender-dev             libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev
      - name: Run focused Rust tests with Bevy system diagnostics
        run: cargo test --lib -- --nocapture
